<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d7bff"/><stop offset=".5" stop-color="#5b7cff"/><stop offset="1" stop-color="#2ee6ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#2ee6ff" stop-opacity=".55"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tile"><rect x="88" y="88" width="336" height="336" rx="88"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="#15171d"/>
  <!-- Neon light behind the frosted tile -->
  <circle cx="178" cy="168" r="112" fill="#8b5cff" filter="url(#blur)" opacity=".95"/>
  <circle cx="352" cy="352" r="104" fill="#22d8ff" filter="url(#blur)" opacity=".8"/>
  <circle cx="372" cy="150" r="60" fill="#ff4fd8" filter="url(#blur)" opacity=".5"/>
  <!-- Frosted glass tile with a glossy upper reflection -->
  <rect x="88" y="88" width="336" height="336" rx="88" fill="url(#glass)"/>
  <path d="M88 88h336v128C340 176 196 186 88 250Z" fill="url(#gloss)" clip-path="url(#tile)" opacity=".55"/>
  <rect x="89.5" y="89.5" width="333" height="333" rx="86.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Org structure glyph: head unit and the units below it -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 214v34M178 296v-24a24 24 0 0 1 24-24h108a24 24 0 0 1 24 24v24"/>
  </g>
  <g filter="url(#glow)">
    <rect x="212" y="150" width="88" height="64" rx="20" fill="#fff" fill-opacity=".92"/>
    <rect x="136" y="296" width="84" height="62" rx="20" fill="#b9a6ff"/>
    <rect x="292" y="296" width="84" height="62" rx="20" fill="#7cf0ff"/>
  </g>
</svg>
